# cargo-about configuration: generates THIRD_PARTY_LICENSES.html for the release zip
# (scripts/package.ps1). Keep `accepted` in step with the allow-list in deny.toml.
#
# SDL3 is C code compiled into ZPadder; cargo-about only sees its crate's licence, so the package
# script ships SDL's licence and its bundled hidapi licence (BSD option) as separate files.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
