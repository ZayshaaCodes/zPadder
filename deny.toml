# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
#
# ZPadder is MIT OR Apache-2.0 and aims for free OSS code signing (SignPath
# Foundation), so every dependency must be under a permissive OSI licence.
# Copyleft crates (GPL/LGPL/AGPL) must not be added.

[graph]
all-features = true
# The app ships on Windows only for now. The GUI crates' Linux dependencies (GTK, D-Bus) include
# unmaintained crates that never build on Windows; widen this when a Linux GUI arrives.
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list is policy, not a description of today's dependency tree.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]

# Narrow, per-crate exceptions.
exceptions = [
    # egui's bundled fonts: free font licences (OFL is OSI-approved).
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# ZPadder makes no network connections (README, "Privacy"). Keep it that way.
deny = [
    { crate = "reqwest" },
    { crate = "ureq" },
    { crate = "hyper" },
    { crate = "isahc" },
    { crate = "curl" },
    { crate = "attohttpc" },
    { crate = "native-tls" },
    { crate = "rustls" },
    { crate = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
