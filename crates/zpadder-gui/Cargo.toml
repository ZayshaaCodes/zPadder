[package]
name = "zpadder-gui"
description = "ZPadder's editor and tray UI (egui/eframe)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow"] }
png = "0.18"
rfd = "0.18"
serde.workspace = true
toml.workspace = true
tracing.workspace = true
zpadder-config.workspace = true
zpadder-import-xpadder.workspace = true
zpadder-model.workspace = true
zpadder-platform.workspace = true
zpadder-runtime.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tray-icon = "0.26"
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
