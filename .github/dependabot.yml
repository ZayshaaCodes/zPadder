version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The ref after `@` picks the Rust version (`@1.95` is the minimum supported Rust), not a
      # version of the action; Rust versions are bumped on purpose, with rust-toolchain.toml.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine updates instead of one per crate.
      minor-and-patch:
        update-types: [minor, patch]
